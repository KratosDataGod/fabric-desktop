name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-desktop-windows
          path: app/src-tauri/target/release/fabric-desktop.exe
          if-no-files-found: error

  release:
    # Every green build of main replaces the "latest" release with the new exe.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sidecar, shell]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fabric-desktop-windows
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest fabric-desktop.exe \
            --title "Fabric Desktop (latest build)" \
            --notes "Built automatically from ${GITHUB_SHA::7} on main. Download fabric-desktop.exe and double-click it." \
            --target "$GITHUB_SHA"
